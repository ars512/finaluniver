version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: soft_postgres
    environment:
      POSTGRES_DB: soft
      POSTGRES_USER: soft
      POSTGRES_PASSWORD: soft
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: soft_app
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/soft
      SPRING_DATASOURCE_USERNAME: soft
      SPRING_DATASOURCE_PASSWORD: soft

volumes:
  pgdata:
